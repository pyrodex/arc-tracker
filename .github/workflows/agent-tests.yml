name: arc-vision agent tests

on:
  push:
    branches: [main]
    paths: ['agent/**', '.github/workflows/agent-tests.yml']
  pull_request:
    paths: ['agent/**', '.github/workflows/agent-tests.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Tesseract
        # Retry and time-box apt: Ubuntu mirror hiccups shouldn't hang the job for 8 minutes.
        timeout-minutes: 6
        run: |
          for i in 1 2 3; do
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update &&
            sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends tesseract-ocr && break
            echo "apt attempt $i failed; retrying in 20s"; sleep 20
          done
          tesseract --version
      - name: Install dependencies
        # Headless OpenCV on CI; the tests don't need capture, hotkeys or the overlay.
        run: pip install opencv-python-headless numpy pytesseract requests pytest
      - name: Run tests
        working-directory: agent
        run: python -m pytest tests -q
